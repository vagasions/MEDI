# MEDI PdM 게이트웨이 설정
# 사용법: 이 파일을 config.yaml 로 복사한 뒤 현장 환경에 맞게 수정
#   cp config.example.yaml config.yaml
#   uvicorn main:app --host 0.0.0.0 --port 8137

server:
  port: 8137
  # 웹앱(GitHub Pages 또는 로컬 index.html)에서 접근을 허용할 오리진
  cors_origins: ["*"]

# 사용할 커넥터: simulator | dataparc_rest | opcua | parcdata_sql | csv_dir
connector: simulator

# ── ① dataPARC.Store REST API (신형 dataPARC — 권장) ─────────────────
# 공식 OpenAPI 스펙으로 검증 (github.com/dataPARC/store → rest/dataparcstore.json,
# 렌더링: https://dataparc.github.io/store/rest/):
#   · read 엔드포인트의 tagIds 는 숫자 태그 ID(int32)만 받음 — "ex: 45,100,2291"
#   · 이름 조회: GET /api/v1/tags?group=&interface= (브라우즈) 또는
#                GET /api/v1/tags/{group}/{interface}/{name} (단건)
#   · 타임스탬프 ISO8601 UTC(Z, ms), 값에 quality(int32), 태그별 status
#     (Success/NoValues/UnknownOrInactiveTag/Unlicensed...)
#   · HTTPS 전용, 기본 포트 12340. 보안 여부는 GET /auth-info (루트 경로!)
#   · dataPARC.Store 도입 사이트(release2405+) 전용 — 구형 PARChistory는 ② OPC UA 사용
dataparc_rest:
  base_url: "https://DATAPARC-SERVER:12340"   # HTTPS 전용
  verify_tls: true                             # 사내 자가서명 인증서면 false 또는 CA 경로
  # 보안 활성 서버(OAuth)라면 토큰 발급 후 기입. GET {base}/auth-info 로 보안 여부 확인
  bearer_token: null
  # 태그 매핑 (웹앱 태그명 → dataPARC 식별자) — 두 형태 지원:
  #   숫자 ID를 알면:        FT-101: 4512
  #   정규화 이름만 알면:    FT-101: "InterfaceGroup/Interface/TagName"  (기동 시 ID 자동 해석)
  # 숫자 ID는 PARCview 태그 속성 또는 GET /api/v1/tags 로 확인
  tags:
    FT-101: "Plant/NCC/FT101.PV"
    PT-101: "Plant/NCC/PT101.PV"
    # ...

# ── ② OPC UA (모든 dataPARC 서버에 존재 — 구버전 포함 범용) ───────────
opcua:
  endpoint: "opc.tcp://DATAPARC-SERVER:51235/Capstone/OPCUAServer"
  # 인증: anonymous | username
  auth: anonymous
  username: null
  password: null
  # 태그 ID → NodeId 매핑
  tags:
    FT-101: "ns=2;s=Plant.NCC.FT101.PV"
    # ...

# ── ③ PARCdata SQL (SQL Server + CLR 함수 배포된 사이트) ─────────────
# SELECT * FROM ctc_fn_PARCdata_ReadRawTags('tag1,tag2', @start, @end, 0)
parcdata_sql:
  dsn: "DRIVER={ODBC Driver 17 for SQL Server};SERVER=SQLSERVER;DATABASE=ctc_config;Trusted_Connection=yes"
  tags:
    FT-101: "Plant.NCC.FT101.PV"
    # ...

# ── ④ CSV 폴더 감시 (dataPARC 내보내기 파일을 폴더에 떨어뜨리는 방식) ──
csv_dir:
  path: "./data"        # *.csv 를 읽음 (wide: Time,TAG1,TAG2… / long: Time,Tag,Value)
